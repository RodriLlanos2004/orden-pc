<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orden PC</title>
    <script>
      // Aplica el tema antes de pintar para evitar el destello.
      (function () {
        var t = null;
        // "tema-crema": la paleta crema arranca en claro aunque antes hayas usado el oscuro.
        try { t = localStorage.getItem("tema-crema"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
